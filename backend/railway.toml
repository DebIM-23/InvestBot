[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "bash -c \"cd /app/python && python3 -m uvicorn data_fetcher:app --host 0.0.0.0 --port 8000 & sleep 5 && cd /app && node init-db.js && node server.js\""
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
